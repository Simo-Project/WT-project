<h2>Request Details</h2>

<div id="detailsMsg" class="mb-3"></div>

<div id="detailsCard" class="card">
    <div class="card-body">
        <div class="text-muted">Loading…</div>
    </div>
</div>


<div class="d-flex gap-2 mt-3">
    <button id="cancelBtn" class="btn btn-danger" style="display:none;">Cancel Request</button>
    <button id="backBtn2" class="btn btn-outline-secondary">Back to My Requests</button>
</div>

<div class="card mt-3">
    <div class="card-body">
        <h5>Add Comment</h5>
        <div id="commentMsg" class="mb-2"></div>
        <form id="commentForm">
            <div class="mb-3">
                <textarea id="commentText" class="form-control" rows="3" placeholder="Add an update or extra detail..."></textarea>
            </div>
            <button class="btn btn-primary" type="submit">Post Comment</button>
        </form>
    </div>
</div>

<div class="card mt-3">
    <div class="card-body">
        <h5>Comment History</h5>
        <div id="commentsList" class="text-muted">No comments yet.</div>
    </div>
</div>

<div class="mt-3">
    <button id="backBtn" class="btn btn-outline-secondary">Back to My Requests</button>
</div>
