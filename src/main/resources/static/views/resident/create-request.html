<h2>Create Maintenance Request (Resident)</h2>

<div id="residentMsg"></div>

<form id="createRequestForm" class="mt-3">
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input id="title" class="form-control" type="text" placeholder="e.g. Leaking tap" />
  </div>

  <div class="mb-3">
    <label class="form-label">Category</label>
    <select id="category" class="form-select">
      <option value="">Select…</option>
      <option value="PLUMBING">Plumbing</option>
      <option value="ELECTRICAL">Electrical</option>
      <option value="HEATING">Heating</option>
      <option value="OTHER">Other</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea id="description" class="form-control" rows="4" placeholder="Describe the issue..."></textarea>
  </div>

  <button class="btn btn-primary" type="submit">Submit Request</button>
</form>
