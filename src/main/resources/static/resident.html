<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Portal</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<form action="/logout" method="post" class="m-2">
    <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
    <a class="btn btn-link btn-sm" href="/index.html">Back to Home</a>
</form>

<div class="container">
    <h1 class="text-center mt-3">Resident Portal</h1>

    <div id="messageArea" class="mt-3"></div>

    <div class="card mt-3">
        <div class="card-body">
            <h5 class="card-title">Create a maintenance request</h5>

            <form id="createRequestForm">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input id="title" class="form-control" type="text" placeholder="e.g., Leaking tap" required>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" class="form-select" required>
                        <option value="">Select category...</option>
                        <option value="PLUMBING">Plumbing</option>
                        <option value="ELECTRICAL">Electrical</option>
                        <option value="HEATING">Heating</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea id="description" class="form-control" rows="4"
                              placeholder="Describe the issue" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit request</button>
            </form>
        </div>
    </div>

    <div class="card mt-4 mb-5">
        <div class="card-body">
            <h5 class="card-title">My Requests</h5>
            <table id="myRequestsTable" class="display" style="width:100%;">
                <thead>
                <tr>
                    <th>Created</th>
                    <th>Task</th>
                    <th>Status</th>
                    <th>Priority</th>
                </tr>
                </thead>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="resident.js"></script>
</body>
</html>
