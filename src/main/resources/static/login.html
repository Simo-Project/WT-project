<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - MRMS</title>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-3">NullPointerProperties Login</h3>
                    <p class="text-muted mb-4">Sign in to access your dashboard.</p>

                    <div id="msg"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input id="username" class="form-control" type="text" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input id="password" class="form-control" type="password" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Login</button>
                    </form>

                    <hr class="my-4">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const msg = document.getElementById("msg");
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        msg.innerHTML = "";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
            const res = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            const data = await res.json();

            if (!res.ok) {
                msg.innerHTML = '<div class="alert alert-danger">Login failed. Check username/password.</div>';
                return;
            }

            localStorage.setItem("token", data.token);
            window.location.href = "/";
        } catch (err) {
            msg.innerHTML = '<div class="alert alert-danger">Login request failed.</div>';
        }
    });
</script>

</body>
</html>
