<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - MRMS</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-3">MRMS Login</h3>
                    <p class="text-muted mb-4">Sign in to access your dashboard.</p>

                    <div id="msg"></div>

                    <form method="post" action="/login">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input class="form-control" type="text" name="username" placeholder="e.g. admin" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input class="form-control" type="password" name="password" placeholder="••••••••" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Login</button>
                    </form>

                    <hr class="my-4">

                    <div class="small text-muted">
                        <div><b>Example users</b></div>
                        <div>admin / admin123</div>
                        <div>resident / resident123</div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const msg = document.getElementById("msg");

    if (params.has("error")) {
        msg.innerHTML = '<div class="alert alert-danger">Login failed. Check username/password.</div>';
    }
    if (params.has("logout")) {
        msg.innerHTML = '<div class="alert alert-success">Logged out successfully.</div>';
    }
</script>

</body>
</html>
